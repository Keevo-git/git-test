name: Generate Day 1 IT Reviewer DOCX

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "Day_1_IT_Fundamentals_Intensive_Reviewer.docx"

permissions:
  contents: write

jobs:
  generate-docx:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewer branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document dependency
        run: python -m pip install --disable-pip-version-check python-docx

      - name: Generate DOCX
        run: python tools/generate_day1_reviewer.py

      - name: Commit generated document
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Day_1_IT_Fundamentals_Intensive_Reviewer.docx
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate Day 1 reviewer DOCX [skip ci]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
